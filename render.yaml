services:
  - type: web
    name: covert-chat
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # Optional TURN server credentials (uncomment & set in Render dashboard if needed)
      # - key: VITE_TURN_URL
      #   sync: false
      # - key: VITE_TURN_USERNAME
      #   sync: false
      # - key: VITE_TURN_CREDENTIAL
      #   sync: false
